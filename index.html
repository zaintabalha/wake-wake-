<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - نظام التوزيع</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --card-bg: #243247;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
        }

        .main-card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        input, select, button {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
        }

        input, select {
            background: var(--card-bg);
            color: #fff;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 14px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background-color: var(--surface);
            color: var(--text-muted);
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-delivered { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2>لوحة تحكم الإدارة العامة</h2>
            <p style="color: var(--text-muted); font-size: 13px;">مربوط مباشرة مع Firebase Firestore</p>
        </div>
        <div id="connection-status" style="font-size: 13px; color: var(--success); font-weight: 700;">
            ● متصل بسحابة Firebase
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي الطلبيات</h3>
            <div class="value" id="total-orders">0</div>
        </div>
        <div class="stat-card">
            <h3>قيد التوصيل</h3>
            <div class="value" style="color: var(--warning);" id="pending-orders">0</div>
        </div>
        <div class="stat-card">
            <h3>تم التسليم</h3>
            <div class="value" style="color: var(--success);" id="delivered-orders">0</div>
        </div>
    </div>

    <div class="main-card">
        <h3>إضافة طلبية جديدة وتعيين الموزع</h3>
        <div class="form-section">
            <input type="text" id="cust-name" placeholder="اسم العميل المستلم">
            <input type="text" id="cust-address" placeholder="العنوان بالتفصيل">
            <input type="text" id="cust-price" placeholder="المبلغ المطلوب (ل.س)">
            <select id="driver-name">
                <option value="سامر">الموزع: سامر</option>
                <option value="أحمد">الموزع: أحمد</option>
                <option value="عمر">الموزع: عمر</option>
            </select>
            <button onclick="addOrder()">إرسال الطلب إلى السحابة 🚀</button>
        </div>
    </div>

    <div class="main-card">
        <h3>سجل الطلبات المتزامنة لحظياً</h3>
        <table>
            <thead>
                <tr>
                    <th>معرّف الطلب</th>
                    <th>العميل</th>
                    <th>العنوان</th>
                    <th>المبلغ</th>
                    <th>الموزع</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="orders-table">
                <!-- جلب الطلبات لحظياً من السحابة -->
            </tbody>
        </table>
    </div>
</div>

<!-- مكتبات Firebase Compat لتشغيل الويب السحابي المباشر -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyCmgHOmOuuAcgcMBLupnf39OeR45Spf8Mo",
        authDomain: "wake-wake-6fb98.firebaseapp.com",
        projectId: "wake-wake-6fb98",
        storageBucket: "wake-wake-6fb98.firebasestorage.app",
        messagingSenderId: "677970870264",
        appId: "1:677970870264:web:36fc86c91d479c03fda00d",
        measurementId: "G-LNFEM4MMTR"
    };

    // تهيئة الاتصال بـ Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // الاستماع اللحظي لقاعدة البيانات المشتركة (Firestore)
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const table = document.getElementById("orders-table");
        table.innerHTML = "";

        let pendingCount = 0;
        let deliveredCount = 0;

        snapshot.forEach((doc) => {
            const order = doc.data();
            const isDelivered = order.status === "delivered";

            if (isDelivered) deliveredCount++;
            else pendingCount++;

            const statusClass = isDelivered ? "status-delivered" : "status-pending";
            const statusText = isDelivered ? "تم التسليم" : "قيد التوصيل";

            const row = `
                <tr>
                    <td><strong>${order.orderCode || doc.id.substring(0, 6)}</strong></td>
                    <td>${order.customer}</td>
                    <td>${order.address}</td>
                    <td>${order.price || 'مدفوع'}</td>
                    <td>${order.driver}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                </tr>
            `;
            table.innerHTML += row;
        });

        document.getElementById("total-orders").innerText = snapshot.size;
        document.getElementById("pending-orders").innerText = pendingCount;
        document.getElementById("delivered-orders").innerText = deliveredCount;
    }, (error) => {
        console.error("خطأ في جلب البيانات:", error);
        document.getElementById("connection-status").innerText = "⚠️ تحقق من صلاحيات Firestore Rules";
        document.getElementById("connection-status").style.color = "var(--warning)";
    });

    // إضافة طلب جديد إلى Firestore
    async function addOrder() {
        const name = document.getElementById("cust-name").value.trim();
        const address = document.getElementById("cust-address").value.trim();
        const price = document.getElementById("cust-price").value.trim();
        const driver = document.getElementById("driver-name").value;

        if (!name || !address) {
            alert("يرجى إدخال اسم العميل والعنوان.");
            return;
        }

        const newOrder = {
            orderCode: "ORD-" + Math.floor(1000 + Math.random() * 9000),
            customer: name,
            address: address,
            price: price ? price + " ل.س" : "مدفوع مسبقاً",
            driver: driver,
            status: "pending",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("orders").add(newOrder);
            document.getElementById("cust-name").value = "";
            document.getElementById("cust-address").value = "";
            document.getElementById("cust-price").value = "";
        } catch (e) {
            alert("حدث خطأ أثناء الإرسال: " + e.message);
        }
    }
</script>
</body>
</html>
