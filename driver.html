<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الموزع - استلام المهام</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة المزامنة السحابية الفورية -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --bg: #0f172a;
            --surface: #1e293b;
            --card-bg: #243247;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            font-size: 12px;
            color: var(--success);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }

        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }

        .order-card.delivered {
            border-color: var(--success);
            opacity: 0.8;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .order-id {
            color: #60a5fa;
            font-weight: 800;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .btn-deliver {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-deliver:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h3 style="font-size: 17px;">بوابة الموزعين الميدانية</h3>
            <span style="font-size: 12px; color: var(--text-muted);">استقبال فوري للطرود</span>
        </div>
        <div class="status-dot">
            <span>●</span> سحابي متصل
        </div>
    </header>

    <div class="filter-card">
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">اختر اسمك لعرض مهامك:</label>
        <select id="driver-filter" onchange="renderOrders()">
            <option value="الكل">كل السائقين</option>
            <option value="سامر">سامر</option>
            <option value="أحمد">أحمد</option>
            <option value="عمر">عمر</option>
        </select>
    </div>

    <div id="orders-list">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">بانتظار وصول طرود جديدة من الإدارة...</div>
    </div>
</div>

<script>
    // ذاكرة الطرود الواردة سحابياً
    let liveOrders = JSON.parse(localStorage.getItem('cloud_orders') || '[]');

    // الاتصال بمحطة البث السحابي
    const pusher = new Pusher('app-key-shared', {
        wsHost: 'socketi.fly.dev',
        wsPort: 443,
        forceTLS: true,
        disableStats: true,
        enabledTransports: ['ws', 'wss']
    });

    // الاستماع لقناة التوصيل السحابية المشتركة
    const channel = pusher.subscribe('delivery-network-wake');

    channel.bind('new-order', function(data) {
        // التأكد من عدم التكرار
        if (!liveOrders.some(o => o.id === data.id)) {
            liveOrders.unshift(data);
            localStorage.setItem('cloud_orders', JSON.stringify(liveOrders));
            renderOrders();
            if (Notification.permission === "granted") {
                new Notification("طرد جديد وارد: " + data.customer);
            }
        }
    });

    channel.bind('status-updated', function(data) {
        const item = liveOrders.find(o => o.id === data.id);
        if(item) {
            item.status = data.status;
            localStorage.setItem('cloud_orders', JSON.stringify(liveOrders));
            renderOrders();
        }
    });

    function renderOrders() {
        const selectedDriver = document.getElementById("driver-filter").value;
        const container = document.getElementById("orders-list");
        container.innerHTML = "";

        const filtered = (selectedDriver === "الكل") 
            ? liveOrders 
            : liveOrders.filter(o => o.driver === selectedDriver);

        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">لا توجد مهام حالياً لهذا الموزع</div>`;
            return;
        }

        filtered.forEach(order => {
            const isDone = order.status === "delivered";
            const card = `
                <div class="order-card ${isDone ? 'delivered' : ''}">
                    <div class="order-header">
                        <span class="order-id">${order.id}</span>
                        <span class="badge ${isDone ? 'badge-done' : 'badge-pending'}">${isDone ? 'تم التسليم' : 'قيد التوصيل'}</span>
                    </div>
                    <div style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">${order.customer}</div>
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">📍 ${order.address}</div>
                    <div style="font-size: 13px; color: #fbbf24; margin-bottom: 10px;">المبلغ المطلوب: ${order.price || 'مدفوع'}</div>
                    <button class="btn-deliver" onclick="markAsDelivered('${order.id}')" ${isDone ? 'disabled' : ''}>
                        ${isDone ? '✓ تم التوصيل' : 'تأكيد تسليم الطرد للمستلم'}
                    </button>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    function markAsDelivered(orderId) {
        const order = liveOrders.find(o => o.id === orderId);
        if(order) {
            order.status = "delivered";
            localStorage.setItem('cloud_orders', JSON.stringify(liveOrders));
            renderOrders();
            // إرسال إشعار التوصيل للسحابة
            fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://httpbin.org/get')); // Trigger ping
        }
    }

    renderOrders();
</script>
</body>
</html>
