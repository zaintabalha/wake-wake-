<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الموزع - استلام وتأكيد الطرود</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --bg: #0f172a;
            --surface: #1e293b;
            --card-bg: #243247;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            font-size: 13px;
            color: var(--success);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            outline: none;
        }

        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .order-card.delivered {
            border-color: var(--success);
            opacity: 0.85;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .order-code {
            color: #60a5fa;
            font-weight: 800;
            font-size: 15px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .btn-deliver {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 14px;
            transition: opacity 0.2s;
        }

        .btn-deliver:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h3 style="font-size: 17px;">بوابة الموزع الميدانية</h3>
            <span style="font-size: 12px; color: var(--text-muted);">مزامنة حية مع Firebase</span>
        </div>
        <div id="conn-status" class="status-dot">
            <span>●</span> متصل بالخادم
        </div>
    </header>

    <div class="filter-card">
        <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px; font-weight: 600;">حدد اسمك لعرض طلبياتك:</label>
        <select id="driver-filter" onchange="renderOrders()">
            <option value="الكل">عرض كافة الطلبيات</option>
            <option value="سامر">الموزع: سامر</option>
            <option value="أحمد">الموزع: أحمد</option>
            <option value="عمر">الموزع: عمر</option>
        </select>
    </div>

    <div id="orders-list">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">جاري تحميل المهام من السحابة...</div>
    </div>
</div>

<!-- مكتبات Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyCmgHOmOuuAcgcMBLupnf39OeR45Spf8Mo",
        authDomain: "wake-wake-6fb98.firebaseapp.com",
        projectId: "wake-wake-6fb98",
        storageBucket: "wake-wake-6fb98.firebasestorage.app",
        messagingSenderId: "677970870264",
        appId: "1:677970870264:web:36fc86c91d479c03fda00d",
        measurementId: "G-LNFEM4MMTR"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allOrders = [];

    // استماع لحظي لجدول الطلبات من Firestore
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allOrders = [];
        snapshot.forEach((doc) => {
            allOrders.push({
                docId: doc.id,
                ...doc.data()
            });
        });
        renderOrders();
    }, (error) => {
        console.error("خطأ في الاتصال:", error);
        const status = document.getElementById("conn-status");
        status.innerText = "⚠️ انقطع الاتصال بالخادم";
        status.style.color = "#ef4444";
    });

    function renderOrders() {
        const selectedDriver = document.getElementById("driver-filter").value;
        const container = document.getElementById("orders-list");
        container.innerHTML = "";

        const filtered = (selectedDriver === "الكل")
            ? allOrders
            : allOrders.filter(o => o.driver === selectedDriver);

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">لا توجد أي مهام مسندة حالياً</div>`;
            return;
        }

        filtered.forEach(order => {
            const isDelivered = order.status === "delivered";
            const card = `
                <div class="order-card ${isDelivered ? 'delivered' : ''}">
                    <div class="order-header">
                        <span class="order-code">${order.orderCode || order.docId.substring(0, 6)}</span>
                        <span class="badge ${isDelivered ? 'badge-done' : 'badge-pending'}">
                            ${isDelivered ? 'تم التسليم' : 'قيد التوصيل'}
                        </span>
                    </div>
                    <div style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">👤 ${order.customer}</div>
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">📍 ${order.address}</div>
                    <div style="font-size: 13px; color: #fbbf24; font-weight: 700; margin-bottom: 8px;">💰 المبلغ: ${order.price || 'مدفوع'}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">الموزع المسؤول: ${order.driver}</div>
                    <button class="btn-deliver" onclick="confirmDelivery('${order.docId}')" ${isDelivered ? 'disabled' : ''}>
                        ${isDelivered ? '✓ تم توصيل هذا الطرد' : 'تأكيد تسليم الطلب للمستلم'}
                    </button>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    // تحديث حالة الطلب في Firestore مباشرة
    async function confirmDelivery(docId) {
        try {
            await db.collection("orders").doc(docId).update({
                status: "delivered",
                deliveredAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (err) {
            alert("تعذر تحديث الحالة: " + err.message);
        }
    }
</script>
</body>
</html>
