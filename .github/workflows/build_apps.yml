name: Build WAKE WAKE Apps (APK & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==============================
  # 1. بناء ملفات أندرويد (APK)
  # ==============================
  build-admin-apk:
    name: Build Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        working-directory: ./admin_app
        run: |
          flutter create . --platforms=android --org com.wakewake
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Admin APK
        working-directory: ./admin_app
        run: flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: WAKE-WAKE-Admin-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk

  build-driver-apk:
    name: Build Driver APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        working-directory: ./driver_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.wakewake
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Driver APK
        working-directory: ./driver_app
        run: flutter build apk --release

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: WAKE-WAKE-Driver-APK
          path: driver_app/build/app/outputs/flutter-apk/app-release.apk

  # ==============================
  # 2. بناء ملفات آبل (IPA)
  # ==============================
  build-admin-ipa:
    name: Build Admin IPA (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build & Package Admin IPA
        working-directory: ./admin_app
        run: |
          flutter create . --platforms=ios --org com.wakewake
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r WAKE-WAKE-Admin.ipa Payload

      - name: Upload Admin IPA
        uses: actions/upload-artifact@v4
        with:
          name: WAKE-WAKE-Admin-IPA
          path: admin_app/build/ios/iphoneos/WAKE-WAKE-Admin.ipa

  build-driver-ipa:
    name: Build Driver IPA (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build & Package Driver IPA
        working-directory: ./driver_app
        run: |
          flutter create . --platforms=ios --org com.wakewake
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r WAKE-WAKE-Driver.ipa Payload

      - name: Upload Driver IPA
        uses: actions/upload-artifact@v4
        with:
          name: WAKE-WAKE-Driver-IPA
          path: driver_app/build/ios/iphoneos/WAKE-WAKE-Driver.ipa
